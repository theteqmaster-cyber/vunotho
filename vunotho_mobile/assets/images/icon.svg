<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="50%" stop-color="#0F2942" />
      <stop offset="100%" stop-color="#051424" />
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="#10B981" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="16,8" />
  
  <!-- Outer Glow Orbit -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#F59E0B" stroke-width="3" stroke-opacity="0.25" />
  <circle cx="256" cy="76" r="14" fill="#10B981" filter="url(#glow)" />
  <circle cx="383" cy="383" r="12" fill="#F59E0B" filter="url(#glow)" />
  <circle cx="76" cy="256" r="10" fill="#2DD4BF" filter="url(#glow)" />

  <!-- Center Rounded Badge -->
  <rect x="128" y="128" width="256" height="256" rx="64" fill="url(#vGrad)" filter="url(#glow)" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Stylized V Monogram -->
  <path d="M192 192 L256 320 L320 192" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
</svg>
